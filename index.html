<body>
<div id="nav"></div>
<button id="fab2" data-fab2="1" aria-label="Lecture / édition" style="display:none"></button>
<button id="fab" data-go="home" aria-label="Index">☰ Index</button>
<main id="main"></main>
<div id="toast"></div>
<div id="modal"><div id="mbox"></div></div>
<div id="sheet"><div id="sheetIn"></div></div>

<script src="config.js" onerror="void 0"></script>
<script>
/* =====================================================================
   Ma classe CE1 — appli unique. Un seul jeu de données (S), un seul CSV,
   une seule synchro Supabase. Rien n'est jamais écrasé sans confirmation.
   ===================================================================== */
const LS_KEY = "classe-ce1-v2", LS_CFG = "classe-ce1-v2-cloud", LS_PAGE = "classe-ce1-v2-page";
const MODS = { sons: "Sons", ecriture: "Écriture", vie: "Vie de classe", matos: "Matériel" };
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isoD = dt => dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
const today = () => isoD(new Date());
const frDate = d => { const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : d; };
const fmt = n => (Math.round(n * 10) / 10).toString().replace(".", ",");
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const mean = a => { a = a.filter(v => typeof v === "number" && !isNaN(v)); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const nm = s => esc(s.name) + (s.excl ? ' <small class="muted">(hors moyenne)</small>' : '');
const byName = (a, b) => a.name.localeCompare(b.name, "fr", { sensitivity: "base" });
const isDetail = name => /fran[cç]ais|math/i.test(name);
const isDetailCols = name => /fran[cç]ais|math|emc/i.test(name);   // colonnes du bilan Notes (EMC garde ses sous-matières automatiques)

/* ---------- Données ---------- */
function defaults() {
  const sub = n => ({ id: uid(), name: n });
  return {
    v: 2, updatedAt: null,
    students: [],
    subjects: [
      { id: uid(), name: "Français", subs: ["Lecture", "Écriture", "Orthographe", "Grammaire", "Vocabulaire"].map(sub) },
      { id: uid(), name: "Mathématiques", subs: ["Nombres", "Calcul", "Géométrie", "Grandeurs et mesures"].map(sub) },
      { id: uid(), name: "EMC", subs: ["Respect des consignes", "Respect des règles de vie"].map(sub) },
      { id: uid(), name: "Questionner le monde", subs: [] },
      { id: uid(), name: "Anglais", subs: [] },
      { id: uid(), name: "EPS", subs: [] },
      { id: uid(), name: "Arts", subs: [] }
    ],
    items: {
      sons: [], ecriture: [], matos: [],
      vie: [{ id: uid(), name: "Respect des consignes", emc: "consignes", w: 1 }, { id: uid(), name: "Respect des règles de vie", emc: "regles", w: 1 }]
    },
    counts: {},   // counts[élève][module][item] = cette semaine
    term: {},     // cumul des semaines précédentes (même forme)
    lent: {},     // lent["élève::item"] = true
    evals: [],    // {id,date,subjectId,subId,label,max,grades{élève:note}}
    fields: [     // champs des fiches élèves (modifiables dans ⚙️ Paramètres)
      { id: uid(), name: "Responsable(s) légal(aux)", type: "text" },
      { id: uid(), name: "Téléphone", type: "tel" },
      { id: uid(), name: "E-mail des parents", type: "email" },
      { id: uid(), name: "Suivi extérieur", type: "long" },
      { id: uid(), name: "Remarques", type: "long" }
    ],
    info: {}      // info[élève][champ] = texte
  };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && Array.isArray(d.students) && d.items) return fix(d);
  } catch (e) {}
  return defaults();
}
function jMigrate(d) {   // anciennes références {id, dailyOf} (contenu partagé) → vraies copies, sans rien perdre
  if (!(d.jdaily || []).length) return;
  Object.keys(d.journal || {}).forEach(day => d.journal[day] = d.journal[day].map(x => {
    if (!x.dailyOf || x.type) return x; const t = d.jdaily.find(q => q.id === x.dailyOf); if (!t) return x;
    const c = JSON.parse(JSON.stringify(t)); c.id = x.id; c.dailyOf = t.id; delete c.since; return c;
  }));
}
function fix(d) {
  const b = defaults();
  d.items = Object.assign({ sons: [], ecriture: [], vie: [], matos: [] }, d.items);
  ["counts", "term", "lent"].forEach(k => d[k] = d[k] || {});
  d.subjects = d.subjects || b.subjects; d.evals = d.evals || [];
  d.abounds = d.abounds || {}; d.todo = Array.isArray(d.todo) ? d.todo : []; d.journal = d.journal || {};  if (!Array.isArray(d.schoolDays) || !d.schoolDays.length) d.schoolDays = [1, 2, 3, 4, 5]; jMigrate(d); Object.values(d.journal).forEach(a => a.forEach(x => { delete x.dailyOf; })); delete d.jdaily; delete d.jskip; d.cal = d.cal || []; d.jtitles = d.jtitles || {}; d.fields = d.fields || b.fields; d.info = d.info || {};
  if (!d.autoFields) { d.autoFields = true; d.fields.unshift({ id: uid(), name: "Date de naissance", type: "text", auto: "birth" }, { id: uid(), name: "Redoublant", type: "text", auto: "redo" }); }
  return d;
}
let S = fix(load());
let cfg = (() => { try { return JSON.parse(localStorage.getItem(LS_CFG)) || {}; } catch (e) { return {}; } })();
let dirty = false;
function save(quiet) {
  S.updatedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast("⚠ Stockage du navigateur plein ou bloqué"); }
  if (!quiet) { dirty = true; schedulePush(); }
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); }
function modal(html) { $("#mbox").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal() { $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

const stud = id => S.students.find(s => s.id === id);
const findComp = id => { for (const sj of S.subjects) for (const sb of sj.subs) { const c = (sb.comps || []).find(x => x.id === id); if (c) return c; } return null; };
/* Élèves « hors moyenne » (structures particulières) : ils ont leurs notes et leur bilan, mais ne comptent pas dans les moyennes et repères de la classe */
const counted = () => { const c = S.students.filter(s => !s.excl); return c.length ? c : S.students; };
const subj = id => S.subjects.find(s => s.id === id);
const subOf = (sj, id) => sj && sj.subs.find(b => b.id === id);
const compOf = (sb, id) => sb && (sb.comps || []).find(c => c.id === id);
const cnt = (sid, mod, it) => ((S.counts[sid] || {})[mod] || {})[it] || 0;
const trm = (sid, mod, it) => ((S.term[sid] || {})[mod] || {})[it] || 0;
const tot = (sid, mod, it) => cnt(sid, mod, it) + trm(sid, mod, it);
const cumulMods = ["sons", "ecriture"];   // se cumulent sur tout le trimestre (pas de remise à zéro hebdomadaire)
function bump(sid, mod, it, d) {
  const c = ((S.counts[sid] = S.counts[sid] || {})[mod] = S.counts[sid][mod] || {});
  c[it] = Math.max(0, (c[it] || 0) + d);
}

/* ---------- Notes automatiques (calculées, jamais enregistrées) ----------
   écriture → Français › Écriture ; sons → Français › Orthographe ;
   lignes de vie de classe marquées « consignes » / « règles » → EMC.
   Barème relatif à la classe : 10/10 = aucune erreur, 3/10 = le plus d'erreurs de la classe (jamais en dessous de 3). */
let autoWarn = [];
const AUTO_KEYS = [["ecriture", "✍️ Écriture (Français › Écriture)"], ["sons", "🔊 Sons (Français › Orthographe)"], ["emc-consignes", "🙂 EMC › Respect des consignes"], ["emc-regles", "🙂 EMC › Respect des règles de vie"]];
function boundsOf(k) {
  const b = (S.abounds || {})[k] || {}; let lo = Number.isFinite(+b.min) && b.min !== "" && b.min != null ? +b.min : 3, hi = Number.isFinite(+b.max) && b.max !== "" && b.max != null ? +b.max : 10;
  lo = Math.max(0, Math.min(10, lo)); hi = Math.max(0, Math.min(10, hi)); return lo <= hi ? [lo, hi] : [3, 10];
}
function findSub(sjRe, subRe) {
  const sj = S.subjects.find(s => sjRe.test(norm(s.name))); const sb = sj && sj.subs.find(b => subRe.test(norm(b.name)));
  return sj && sb ? { sj, sb } : null;
}
function autoEvals() {
  autoWarn = [];
  const out = [];
  const specs = [
    { key: "ecriture", label: "Compteur d'écriture (automatique)", where: "Français › Écriture", t: findSub(/fran/, /ecriture/),
      val: sid => S.items.ecriture.reduce((a, it) => a + tot(sid, "ecriture", it.id), 0), has: S.items.ecriture.length },
    { key: "sons", label: "Compteur de sons (automatique)", where: "Français › Orthographe", t: findSub(/fran/, /orthographe/),
      val: sid => S.items.sons.reduce((a, it) => a + tot(sid, "sons", it.id), 0), has: S.items.sons.length },
    { key: "emc-consignes", label: "Respect des consignes (automatique)", where: "EMC › Respect des consignes", t: findSub(/emc|moral/, /consigne/),
      val: sid => S.items.vie.filter(i => i.emc === "consignes").reduce((a, it) => a + (it.w ?? 1) * tot(sid, "vie", it.id), 0), has: S.items.vie.some(i => i.emc === "consignes") },
    { key: "emc-regles", label: "Respect des règles de vie (automatique)", where: "EMC › Respect des règles de vie", t: findSub(/emc|moral/, /regle/),
      val: sid => S.items.vie.filter(i => i.emc === "regles").reduce((a, it) => a + (it.w ?? 1) * tot(sid, "vie", it.id), 0), has: S.items.vie.some(i => i.emc === "regles") }
  ];
  specs.forEach(sp => {
    if (!sp.has || !S.students.length) return;
    if (!sp.t) { autoWarn.push(sp.where); return; }
    const vals = {}; S.students.forEach(s => vals[s.id] = sp.val(s.id));
    const mx = Math.max(0, ...counted().map(s => vals[s.id])); if (mx === 0) return;
    const [lo, hi] = boundsOf(sp.key);
    const grades = {}; S.students.forEach(s => grades[s.id] = Math.round(Math.max(lo, Math.min(hi, lo + (hi - lo) * (1 - vals[s.id] / mx))) * 10) / 10);
    out.push({ id: "auto-" + sp.key, auto: true, coef: (() => { const c = (S.abounds || {})[sp.key]; return c && c.coef !== undefined && c.coef !== "" && Number.isFinite(+c.coef) ? Math.max(0, +c.coef) : 1; })(), date: today(), subjectId: sp.t.sj.id, subId: sp.t.sb.id, label: sp.label, max: 10, grades });
  });
  return out;
}
let _ae = null;
const allEvals = () => S.evals.concat(_ae || (_ae = autoEvals()));
const invalidate = () => { _ae = null; };

/* ---------- Moyennes ---------- */
const on10 = (v, m) => (typeof v === "number" && m) ? v / m * 10 : null;
function avgOf(sid, f) {   // moyenne pondérée par les coefficients ; les évaluations « hors moyenne » ne comptent pas
  let sw = 0, sv = 0;
  allEvals().filter(f).forEach(e => { if (e.excl) return; const v = on10(e.grades[sid], e.max), w = e.coef == null ? 1 : +e.coef; if (v === null || !(w > 0)) return; sw += w; sv += w * v; });
  return sw ? sv / sw : null;
}
function classAvg(f) { return mean(counted().map(s => avgOf(s.id, f))); }
const cls = v => v === null ? "" : v >= 7.5 ? "g" : v >= 5 ? "o" : "r";
const pill = v => v === null ? `<span class="pill">–</span>` : `<span class="pill ${cls(v)}">${fmt(v)} / 10</span>`;
function columns(withComps) {   // colonnes du bilan : sous-matières (et compétences) pour français/maths/EMC, matière seule pour le reste
  const cols = [], E = allEvals();
  S.subjects.forEach(sj => {
    if (!E.some(e => e.subjectId === sj.id)) return;
    if (isDetailCols(sj.name)) sj.subs.forEach(sb => {
      const f = e => e.subjectId === sj.id && e.subId === sb.id;
      if (!E.some(f)) return;
      cols.push({ label: sj.name + " › " + sb.name, short: sb.name, f, sub: true, sj: sj.name, sjId: sj.id });
      if (withComps) (sb.comps || []).forEach(c => { const g = e => f(e) && e.compId === c.id; if (E.some(g)) cols.push({ label: sj.name + " › " + sb.name + " › " + c.name, short: c.name, f: g, comp: true, sj: sj.name, sjId: sj.id }); });
    });
    cols.push({ label: sj.name, short: "Moyenne", f: e => e.subjectId === sj.id, sj: sj.name, sjId: sj.id, main: true });
  });
  return cols;
}
let classComps = false;
/* Tris : clic sur un en-tête = ordre croissant/décroissant, 3e clic = ordre alphabétique d'origine */
let sorts = {};
const isEmpty = v => v === null || v === undefined || v === "";
function sortRows(list, id, getter) {
  const s = sorts[id]; if (!s) return list; const dir = s.d === "desc" ? -1 : 1;
  return [...list].sort((a, b) => { const x = getter(a, s.k), y = getter(b, s.k);
    if (isEmpty(x)) return isEmpty(y) ? 0 : 1; if (isEmpty(y)) return -1;
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "fr", { numeric: true, sensitivity: "base" })) * dir; });
}
function sth(id, k, type, label, attrs, print) {   // en-tête cliquable
  if (print) return `<th ${attrs || ""}>${label}</th>`;
  const s = sorts[id], on = s && s.k === k;
  return `<th class="srt ${on ? "srton" : ""}" data-sort="${id}|${k}|${type}" ${attrs || ""} title="Trier">${label}<span class="sar">${on ? (s.d === "asc" ? " ▲" : " ▼") : " ⇅"}</span></th>`;
}
/* Tableau de la vue classe : moyennes par matière ET par sous-matière (et par compétence si demandé) */
function classNotesTable(print) {
  const cols = columns(classComps);
  if (!cols.length) return `<p class="muted">Aucune note.</p>`;
  const sorted = sortRows([...S.students].sort(byName), "class", (s, k) => k === "__n" ? s.name : k === "__g" ? avgOf(s.id, () => true) : avgOf(s.id, (cols.find(c => c.label === k) || {}).f || (() => false)));
  const groups = []; cols.forEach(c => { const g = groups[groups.length - 1]; if (g && g.sjId === c.sjId) g.cols.push(c); else groups.push({ sjId: c.sjId, name: c.sj, cols: [c] }); });
  const val = v => v === null ? "–" : fmt(v), cell = (v, c) => print ? `<td${c.main ? ' style="font-weight:700"' : ""}>${val(v)}</td>` : `<td class="${c.main ? "cmain" : ""}">${v === null ? '<span class="muted">–</span>' : `<span class="pill ${cls(v)}" style="min-width:0">${fmt(v)}</span>`}</td>`;
  const h1 = `<tr>${sth("class", "__n", "t", "Élève", 'rowspan="2"', print)}${groups.map(g => g.cols.length === 1 ? sth("class", g.cols[0].label, "n", esc(g.name), 'rowspan="2"', print) : `<th colspan="${g.cols.length}" class="gh">${esc(g.name)}</th>`).join("")}${sth("class", "__g", "n", "Général", 'rowspan="2"', print)}</tr>`;
  const h2 = `<tr>${groups.filter(g => g.cols.length > 1).map(g => g.cols.map(c => sth("class", c.label, "n", (c.comp ? "↳ " : "") + esc(c.short), c.main ? 'data-m="1"' : "", print)).join("")).join("")}</tr>`;
  const rows = sorted.map(s => `<tr><td>${print ? esc(s.name) : nm(s)}</td>${cols.map(c => cell(avgOf(s.id, c.f), c)).join("")}${cell(avgOf(s.id, () => true), { main: true })}</tr>`).join("");
  const last = `<tr class="clrow"><td><b>Classe</b></td>${cols.map(c => cell(classAvg(c.f), c)).join("")}${cell(classAvg(() => true), { main: true })}</tr>`;
  return `<div class="${print ? "" : "scroll"}"><table class="ctab"><thead>${h1}${h2}</thead><tbody>${rows}${last}</tbody></table></div>`;
}

/* ===================== Interface ===================== */
const PAGES = [["prog", "🧭 Progressions"], ["journal", "📓 Cahier journal"], ["cal", "📅 Calendrier"], ["todo", "✅ À faire"], ["vie", "🙂 Vie de classe"], ["matos", "📦 Matériel"], ["sons", "🔊✍️ Sons & écriture"], ["notes", "📒 Notes"], ["fiches", "👤 Fiches"], ["an", "🔎 Analyses"], ["set", "⚙️ Paramètres"]];
let page = "home";   // l'appli s'ouvre (et se rouvre après un rafraîchissement) sur l'index
let sel = {};            // élève sélectionné par module
let showTable = {};      // vue classe (tableau) par module

const cfgStatus = () => cfg.url && cfg.key && cfg.code ? "Synchronisation activée." : "Pas de synchronisation : les données restent dans ce navigateur (pense à la sauvegarde JSON).";

const SQL = `-- À coller dans Supabase › SQL Editor › Run (une seule fois)
create table if not exists public.classe_data (
  code text primary key check (length(code) >= 8),
  data jsonb not null,
  rev integer not null default 1,
  updated_at timestamptz not null default now()
);
create table if not exists public.classe_history (
  id bigserial primary key,
  code text not null,
  data jsonb not null,
  rev integer not null,
  saved_at timestamptz not null default now()
);
-- Sécurité : aucune lecture/écriture directe, uniquement via les 2 fonctions ci-dessous
alter table public.classe_data enable row level security;
alter table public.classe_history enable row level security;

create or replace function public.classe_get(p_code text) returns jsonb
language sql security definer set search_path = public as $$
  select jsonb_build_object('rev', rev, 'data', data, 'updated_at', updated_at)
  from public.classe_data where code = p_code and length(p_code) >= 8;
$$;

create or replace function public.classe_put(p_code text, p_data jsonb, p_base integer, p_force boolean default false)
returns integer language plpgsql security definer set search_path = public as $$
declare cur integer; old jsonb;
begin
  if length(p_code) < 8 then raise exception 'code trop court'; end if;
  select rev, data into cur, old from public.classe_data where code = p_code for update;
  if not found then
    insert into public.classe_data(code, data, rev) values (p_code, p_data, 1);
    return 1;
  end if;
  if not p_force and cur <> p_base then return -1; end if;  -- conflit : rien n'est écrasé
  insert into public.classe_history(code, data, rev) values (p_code, old, cur);  -- ancienne version gardée
  delete from public.classe_history where code = p_code and id not in
    (select id from public.classe_history where code = p_code order by id desc limit 30);
  update public.classe_data set data = p_data, rev = cur + 1, updated_at = now() where code = p_code;
  return cur + 1;
end $$;

revoke all on function public.classe_get(text) from public;
revoke all on function public.classe_put(text, jsonb, integer, boolean) from public;
grant execute on function public.classe_get(text) to anon, authenticated;
grant execute on function public.classe_put(text, jsonb, integer, boolean) to anon, authenticated;`;

/* ----- verrouillage par mot de passe : config.js contient URL + clé + code chiffrés (AES-GCM, clé dérivée du mot de passe par PBKDF2) ----- */
const b64 = u => btoa(String.fromCharCode(...u)), unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function lkKey(pw, salt, it) { const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: it, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); }

function schedulePush() { if (!cloudOn()) return; clearTimeout(pushTimer); setSync("⏳ à envoyer…"); pushTimer = setTimeout(() => push(false), 1500); }
async function push(force) {

}

/* ===================== Export / import ===================== */
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type || "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function exportCsv() {
  const q = v => { v = String(v ?? ""); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const line = a => a.map(q).join(";"), num = v => v === null ? "" : String(Math.round(v * 100) / 100).replace(".", ",");
  const out = [], sorted = [...S.students].sort(byName), cols = columns();
  out.push(line(["BILAN PAR ÉLÈVE (cumul : semaines précédentes + semaine en cours)"]));
  const head = ["Élève", ...cols.map(c => c.label + " (/10)"), "Moyenne générale (/10)"];
  const mc = []; ["vie", "sons", "ecriture", "matos"].forEach(m => S.items[m].forEach(it => mc.push({ m, it })));
  out.push(line([...head, ...mc.map(x => MODS[x.m] + " — " + x.it.name)]));
  sorted.forEach(s => out.push(line([s.name, ...cols.map(c => num(avgOf(s.id, c.f))), num(avgOf(s.id, () => true)), ...mc.map(x => tot(s.id, x.m, x.it.id))])));
  out.push(line(["Moyenne de la classe", ...cols.map(c => num(classAvg(c.f))), num(classAvg(() => true))]));
  out.push(""); out.push(line(["DÉTAIL DES ÉVALUATIONS (notes brutes ; « automatique » = calculée depuis les compteurs)"]));
  out.push(line(["Date", "Matière", "Sous-matière", "Compétence", "Intitulé", "Barème", "Automatique", ...sorted.map(s => s.name)]));
  [...allEvals()].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { const sj = subj(e.subjectId); out.push(line([frDate(e.date), sj ? sj.name : "", (subOf(sj, e.subId) || {}).name || "", (compOf(subOf(sj, e.subId), e.compId) || {}).name || "", e.label, e.max, e.auto ? "oui" : "", ...sorted.map(s => typeof e.grades[s.id] === "number" ? String(e.grades[s.id]).replace(".", ",") : "")])); });
  out.push(""); out.push(line(["MATÉRIEL ACTUELLEMENT PRÊTÉ"]));
  Object.keys(S.lent).filter(k => S.lent[k]).forEach(k => { const [sid, iid] = k.split("::"); const st = stud(sid), it = S.items.matos.find(i => i.id === iid); if (st && it) out.push(line([st.name, it.name])); });
  download("classe-ce1-" + today() + ".csv", "﻿" + out.join("\r\n"), "text/csv;charset=utf-8");
}

  if (d.ri) { const [m, id] = d.ri.split("|"), it = S.items[m].find(i => i.id === id), v = t.value.trim(); if (v) { it.name = v; if (m === "vie" && !it.emc) it.emc = inferEmc(v); save(); } return render(); }
  if (d.emc) { S.items.vie.find(i => i.id === d.emc).emc = t.value; save(); return; }
  if (d.w) { S.items.vie.find(i => i.id === d.w).w = Math.max(0, parseFloat(t.value) || 0); save(); return; }
  if (d.rsj) { const v = t.value.trim(); if (v) { subj(d.rsj).name = v; save(); } return render(); }
  if (d.rcp) { const [a, b, c] = d.rcp.split("|"), v = t.value.trim(); if (v) { compOf(subOf(subj(a), b), c).name = v; save(); } return render(); }
  if (d.rsb) { const [a, b] = d.rsb.split("|"), v = t.value.trim(); if (v) { subOf(subj(a), b).name = v; save(); } return render(); }
  if (t.id === "imp") {
    const f = t.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => {
      try {
        const d2 = JSON.parse(r.result); if (!d2 || !Array.isArray(d2.students) || !d2.items) throw 0;
        if (!confirm("Importer cette sauvegarde ? Elle remplace les données actuelles (une copie de sécurité des données actuelles est téléchargée).")) return;
        download("avant-import-" + today() + ".json", JSON.stringify(S, null, 2));
        S = fix(d2); save(); render(); toast("Sauvegarde importée ✓");
      } catch (e) { toast("Fichier non reconnu"); }
    }; r.readAsText(f); t.value = "";
  }
});
document.addEventListener("input", ev => {
  if (ev.target.classList && ev.target.classList.contains("tdta")) tdGrow(ev.target);
  if (ev.target.dataset.tdtitle) { const b = S.todo.find(x => x.id === ev.target.dataset.tdtitle); if (b) { b.title = ev.target.value; save(); } return; }
  if (ev.target.dataset.tdi) { const [bid, iid] = ev.target.dataset.tdi.split("|"), b = S.todo.find(x => x.id === bid), x = b && b.items.find(y => y.id === iid); if (x) { x.t = ev.target.value; save(); } return; }
  if (ev.target.dataset.jtitle !== undefined) { const v = ev.target.value; if (v.trim()) S.jtitles[jdate] = v; else { delete S.jtitles[jdate]; if (jTitle(jdate)) S.jtitles[jdate] = ""; } save(); return; }
  if (ev.target.dataset.jf) { const [id, k] = ev.target.dataset.jf.split("|"), r = jfind(id); if (r) { r.b[k] = ev.target.value; save(); } return; }
  const g = ev.target.dataset.g; if (g === undefined) return;
  const v = ev.target.value.replace(",", "."); if (v === "") delete draft.grades[g]; else draft.grades[g] = parseFloat(v);
  const p = $("#gp-" + g); if (p) p.innerHTML = pill(on10(draft.grades[g], draft.max)); updDraftMean();
});

setInterval(() => { if (!document.hidden && page === "journal" && jmode === "read" && jNowId(jdate) !== jLastNow) render(); }, 30000);   // la surbrillance suit l'heure
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.tdnew) { ev.preventDefault(); const b = document.querySelector(`[data-tdnewbtn="${ev.target.dataset.tdnew}"]`); b && b.click(); } });
render(); updDraftMean();
if (lockedNow()) showLock(); else if (cloudOn()) pull(false);
</script>
